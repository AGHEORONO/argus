name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend + benchmark de detecție
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Aceeași versiune ca în Dockerfile. Pe 3.11 numpy 2.5.2 n-are wheel și build-ul
          # cade — s-a întâmplat deja o dată la primul deploy pe Render.
          python-version: '3.12'
          cache: pip

      - name: Instalează dependențele
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Rulează testele
        # -rs arată motivul fiecărui test sărit. Un test sărit arată verde exact ca unul
        # care trece, iar proiectul ăsta a livrat deja un server de tile-uri complet gol
        # exact așa.
        run: python -m pytest tests/ -v -rs --durations=10

      - name: Verifică faptul că benchmark-ul chiar a rulat
        # Testele care depind de ortofotoplanul descărcat se sar în CI, ceea ce e în regulă.
        # Benchmark-ul de detecție NU are voie să se sară: își generează singur datele, și
        # dacă ajunge vreodată să fie sărit, calitatea detecției nu mai e măsurată de nimeni.
        run: |
          python -m pytest tests/test_recall_benchmark.py -q -s 2>&1 | tee bench.txt
          grep -q "recall 4/4" bench.txt || {
            echo "::error::Benchmark-ul de recall nu a raportat 4/4 — vezi ieșirea de mai sus."
            exit 1
          }
          echo "::notice::$(grep -E 'recall |precizie ' bench.txt | tr '\n' ' ')"

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalează dependențele
        working-directory: app/frontend
        run: npm ci

      - name: Build
        working-directory: app/frontend
        # Prinde erorile de sintaxă JSX înainte de deploy. S-a întâmplat de două ori într-o
        # zi ca un comentariu pus greșit într-un map() să spargă build-ul.
        run: npm run build
